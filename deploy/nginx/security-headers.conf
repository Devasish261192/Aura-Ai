# Security Headers configuration for Aura Career Engine
# LP-4SJ838: Enforced Content-Security-Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auracareer.duckdns.org wss://auracareer.duckdns.org; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# LP-EZFFN4: HSTS policy
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# LP-HGM7T5: Framing restrictions
add_header X-Frame-Options "SAMEORIGIN" always;

# LP-H70Z9F: X-Content-Type-Options
add_header X-Content-Type-Options "nosniff" always;



